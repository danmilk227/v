<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой VPN</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0b0f19; color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: #131b2e; border: 1px solid #1e293b; border-radius: 24px; padding: 28px; width: 100%; max-width: 380px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); text-align: center; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 99px; font-size: 12px; font-weight: bold; margin-bottom: 12px; }
        .badge-active { background: #059669; color: #ecfdf5; }
        .badge-disabled { background: #dc2626; color: #fef2f2; }
        h2 { margin: 0 0 16px; font-size: 20px; }
        .stats { background: #0b0f19; border-radius: 14px; padding: 14px; margin-bottom: 20px; text-align: left; font-size: 14px; }
        .stat-line { display: flex; justify-content: space-between; margin-bottom: 8px; color: #94a3b8; }
        .stat-line strong { color: #f8fafc; }
        .progress-bar { height: 8px; background: #1e293b; border-radius: 99px; overflow: hidden; margin-top: 10px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #38bdf8, #818cf8); width: 0%; }
        #qrcode { background: #fff; padding: 12px; border-radius: 12px; display: inline-block; margin-bottom: 20px; }
        .btn { display: block; width: 100%; padding: 12px; border-radius: 12px; font-weight: 600; text-decoration: none; border: none; cursor: pointer; margin-bottom: 8px; font-size: 14px; }
        .btn-primary { background: #38bdf8; color: #0b0f19; }
        .btn-secondary { background: #1e293b; color: #cbd5e1; }
        .error { color: #f87171; font-size: 14px; }
    </style>
</head>
<body>

<div class="card" id="app">
    <div>Загрузка профиля...</div>
</div>

<script>
    // Твой бесплатный HTTPS бэкенд
    const API_BASE = "https://2.27.29.68.sslip.io";

    function formatGB(bytes) {
        if (!bytes || bytes <= 0) return "0 GB";
        return (bytes / (1024 ** 3)).toFixed(2) + " GB";
    }

    async function loadProfile() {
        const userKey = window.location.hash.replace("#", "").trim();
        const app = document.getElementById("app");

        if (!userKey) {
            app.innerHTML = '<div class="error">В ссылке не указан идентификатор пользователя.</div>';
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/api/user/${encodeURIComponent(userKey)}`);
            if (!res.ok) throw new Error("Пользователь не найден");

            const u = await res.json();
            const usedStr = formatGB(u.used_bytes);
            const totalStr = u.total_bytes > 0 ? formatGB(u.total_bytes) : "Безлимит";
            const pct = u.total_bytes > 0 ? Math.min(100, Math.round((u.used_bytes / u.total_bytes) * 100)) : 0;
            const expireStr = u.expiry > 0 ? new Date(u.expiry * 1000).toLocaleDateString("ru-RU") : "Бессрочно";

            app.innerHTML = `
                <span class="badge ${u.enable ? 'badge-active' : 'badge-disabled'}">${u.enable ? 'Активен' : 'Отключен'}</span>
                <h2>${u.name}</h2>
                <div class="stats">
                    <div class="stat-line"><span>Трафик:</span> <strong>${usedStr} / ${totalStr}</strong></div>
                    <div class="progress-bar"><div class="progress-fill" style="width: ${pct}%"></div></div>
                    <div class="stat-line" style="margin-top: 10px;"><span>Истекает:</span> <strong>${expireStr}</strong></div>
                </div>
                <div id="qrcode"></div>
                <a href="sing-box://import-remote-profile?url=${encodeURIComponent(u.sub_url)}" class="btn btn-primary">Импорт в sing-box</a>
                <button class="btn btn-secondary" onclick="navigator.clipboard.writeText('${u.sub_url}'); alert('Ссылка скопирована!');">Скопировать подписку</button>
            `;

            new QRCode(document.getElementById("qrcode"), { text: u.sub_url, width: 160, height: 160 });

        } catch (e) {
            app.innerHTML = `<div class="error">Не удалось загрузить данные профиля.<br>Проверь ссылку.</div>`;
        }
    }

    loadProfile();
</script>
</body>
</html>
